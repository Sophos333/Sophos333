<svg xmlns="http://www.w3.org/2000/svg" width="920" height="178" viewBox="0 0 920 178" role="img" aria-labelledby="title desc">
  <title id="title">AI Arsenal terminal profile</title>
  <desc id="desc">Animated terminal introducing Oscar Holguin-Silva as an Applied AI Engineer and AI Systems Builder focused on governed AI, data, automation, and human oversight.</desc>

  <rect width="920" height="178" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="918" height="176" rx="11" fill="none" stroke="#30363d"/>

  <circle cx="24" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="5" fill="#27c93f"/>
  <text x="80" y="27" fill="#8b949e" font-family="monospace" font-size="13">ai-arsenal://profile</text>

  <defs>
    <clipPath id="line1"><rect x="24" y="49" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;760;760;760;0" keyTimes="0;0.02;0.18;0.92;0.98;1"/></rect></clipPath>
    <clipPath id="line2"><rect x="24" y="77" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;830;830;830;0" keyTimes="0;0.22;0.42;0.92;0.98;1"/></rect></clipPath>
    <clipPath id="line3"><rect x="24" y="105" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;810;810;810;0" keyTimes="0;0.46;0.66;0.92;0.98;1"/></rect></clipPath>
    <clipPath id="line4"><rect x="24" y="133" width="0" height="24"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;790;790;790;0" keyTimes="0;0.70;0.88;0.92;0.98;1"/></rect></clipPath>
  </defs>

  <g fill="#39ff14" font-family="monospace" font-size="18">
    <text x="24" y="68" clip-path="url(#line1)">&gt; role: Applied AI Engineer</text>
    <text x="24" y="96" clip-path="url(#line2)">&gt; build: governed AI systems + decision workflows</text>
    <text x="24" y="124" clip-path="url(#line3)">&gt; stack: Python | FastAPI | SQL | Databricks | Docker</text>
    <text x="24" y="152" clip-path="url(#line4)">&gt; principle: evidence first. human judgment stays in command.</text>
  </g>

  <text x="882" y="152" fill="#39ff14" font-family="monospace" font-size="18">█
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
